[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rageval"
version = "0.2.0rc1"
description = "A research-grade benchmark and claim-level faithfulness evaluation system for RAG applications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.11.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
bench = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
]
all = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
]

[project.scripts]
rageval = "rageval.cli:main"

[project.urls]
Homepage = "https://github.com/Aaravkhanal/RAGEVAL"
Issues = "https://github.com/Aaravkhanal/RAGEVAL/issues"

[tool.setuptools.packages.find]
include = ["rageval*"]

[tool.setuptools.package-data]
rageval = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "hf: loads Hugging Face or torch models; skip on fast CI",
    "slow: longer than a metric unit test",
]
