[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rageval"
version = "0.2.1"
description = "A research-grade benchmark and claim-level faithfulness evaluation system for RAG applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.11.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
bench = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
]
all = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
]

[project.scripts]
rageval = "rageval.cli:main"

[project.urls]
Homepage = "https://github.com/Aaravkhanal/RAGEVAL"
Issues = "https://github.com/Aaravkhanal/RAGEVAL/issues"

[tool.setuptools.packages.find]
include = ["rageval*"]

[tool.setuptools.package-data]
rageval = ["server/static/*"]

[tool.setuptools.data-files]
"share/rageval/data/raw" = ["data/raw/*.json"]
"share/rageval/data/gold" = ["data/gold/*.json"]
"share/rageval/data/gold/iaa" = ["data/gold/iaa/*.json", "data/gold/iaa/*.md"]
"share/rageval/data/adversarial" = ["data/adversarial/*.json"]
"share/rageval/data/cards" = ["data/cards/*.md"]
"share/rageval/data/manifests" = ["data/manifests/*.json"]
"share/rageval/data/datasets/benchmark_v1" = ["data/datasets/benchmark_v1/*.json"]
"share/rageval/data/datasets/chunk_benchmark_v1" = ["data/datasets/chunk_benchmark_v1/*.json"]
"share/rageval/data/datasets/chunk_benchmark_v1/sources" = ["data/datasets/chunk_benchmark_v1/sources/*.txt"]
"share/rageval/configs" = ["configs/*.yaml"]
"share/rageval/configs/ablation" = ["configs/ablation/*.yaml"]
"share/rageval/configs/experiments" = ["configs/experiments/*.yaml"]
"share/rageval/configs/opt_in" = ["configs/opt_in/*.yaml"]
"share/rageval/configs/examples" = ["configs/examples/*.jsonl"]
"share/rageval/reports/phase7/v1_matrix" = ["reports/phase7/v1_matrix/metrics.json"]
"share/rageval/reports/phase7/v1_1_matrix" = ["reports/phase7/v1_1_matrix/metrics.json"]
"share/rageval/reports/phase7/v1_2_matrix" = ["reports/phase7/v1_2_matrix/metrics.json"]
"share/rageval/reports/phase7/A_chunk_overlap32" = ["reports/phase7/A_chunk_overlap32/metrics.json"]
"share/rageval/reports/phase7/A_chunk_long_v1" = ["reports/phase7/A_chunk_long_v1/metrics.json"]
"share/rageval/reports/phase7/B_embed_v1" = ["reports/phase7/B_embed_v1/metrics.json"]
"share/rageval/reports/phase7/live_matrix_v1" = ["reports/phase7/live_matrix_v1/metrics.json"]
"share/rageval/reports/phase7/nvidia_nim_v1" = ["reports/phase7/nvidia_nim_v1/metrics.json"]
"share/rageval/reports/phase7/nvidia_nim_retrieve" = ["reports/phase7/nvidia_nim_retrieve/metrics.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "hf: loads Hugging Face or torch models; skip on fast CI",
    "slow: longer than a metric unit test",
]
