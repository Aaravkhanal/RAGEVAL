name: RAGeval slow tests (manual / weekly)

# Downloads Hugging Face models. Do not run on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install research extra
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]"
    - name: Hugging Face tests
      run: pytest -m hf --durations=20
