name: RAGeval slow tests (manual / weekly)

# Downloads Hugging Face models. Do not run on every push.
# Fail red when -m hf tests break. Do not ignore step failures.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: rageval-hf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TRANSFORMERS_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-lock-all.txt

    - name: Cache Hugging Face hub
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.cache/huggingface
        key: hf-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'requirements-lock-all.txt', '.github/workflows/nightly.yml') }}
        restore-keys: |
          hf-${{ runner.os }}-py3.12-

    - name: Install from hashed research lock (CPU torch)
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --require-hashes -r requirements-lock-all.txt
        pip install --no-deps -e .

    - name: Hugging Face NLI and evaluator tests
      run: pytest -m hf --ignore=tests/test_sparse_and_indices.py --ignore=tests/test_semantic_chunker.py --durations=20

    - name: Hugging Face embed and FAISS tests
      run: pytest -m hf tests/test_sparse_and_indices.py tests/test_semantic_chunker.py --durations=20
