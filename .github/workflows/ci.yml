name: RAGeval CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install from hashed fast lock
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --require-hashes -r requirements-lock-fast.txt
        pip install --no-deps -e .

    - name: Fast tests
      run: pytest -m "not hf" --durations=15

    - name: Smoke CLI evaluate (heuristic)
      run: |
        python -m rageval.cli evaluate --method heuristic \
          --question "What is the test question?" \
          --answer "The test is valid [1]." \
          --context "The test is valid."

    - name: Smoke experiment (sparse + heuristic)
      run: |
        python -m rageval.cli experiment \
          --config configs/experiments/smoke.yaml \
          --data-dir data \
          --output-dir /tmp/rageval-ci-runs \
          --max-items 2
