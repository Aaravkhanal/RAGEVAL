# Heavier than the other ablation configs: loads a cross-encoder in addition to MiniLM + DeBERTa.
name: Hybrid_RRF_Reranked
seed: 0
chunker:
  strategy: fixed
  chunk_size: 256
  chunk_overlap: 32
retriever:
  method: hybrid
  top_k: 5
reranker:
  enabled: true
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 3
generator:
  backend: mock
  mock_mode: faithful
  abstention_policy: empty_context
evaluator:
  method: nli
  allow_heuristic_fallback: false
