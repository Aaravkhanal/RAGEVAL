experiment_id: live_matrix_v1_core
label: companion
title: Matched six-configuration real-generator matrix
family: ablate
dataset_id: benchmark_v1
split: all
resource_note: 240 NVIDIA NIM calls maximum; one model and generation settings across
  six retrieval configurations. Provider price unavailable; report tokens, not invented
  USD.
opt_in: true
pipelines:
- name: Dense_Chunk128
  seed: 0
  chunker:
    strategy: fixed
    chunk_size: 128
    chunk_overlap: 16
  retriever:
    method: dense
    top_k: 5
  reranker:
    enabled: false
  generator:
    backend: openai
    model_name: nvidia/nemotron-3.5-bolt-e4b
    temperature: 0.0
    max_tokens: 256
    timeout_s: 120
    max_retries: 2
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  evaluator:
    method: nli
    allow_heuristic_fallback: false
  opt_in: true
